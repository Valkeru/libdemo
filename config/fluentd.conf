# fluentd/conf/fluent.conf

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter *.**>
    @type concat
    key log
    use_first_timestamp true
    use_partial_metadata
    separator ""
</filter>

<filter *.**>
    @type parser
    key_name log
    reserve_data true
    <parse>
        @type json
        time_key timestamp
        time_type string
        time_format "%Y-%m-%d %H:%M:%S,%L%Z"
    </parse>
</filter>

<match *.**>
  @type copy

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix ${tag[1]}
    logstash_dateformat %Y%m%d
    include_tag_key true
    type_name access_log
    tag_key @log_name
    flush_interval 1s
  </store>
</match>
