server:
  forward-headers-strategy: framework
  tomcat:
    accept-count: 1000
    threads:
      max: 1000
spring:
  application:
    name: libdemo
  jackson:
    deserialization:
      # https://www.houseoftalents.nl/integrationapplicationtalents/blog/making-spring-boot-applications-return-bad-request-jsonview-ignored-properties
      fail-on-unexpected-view-properties: true
    mapper:
      default-view-inclusion: false
  datasource:
    hikari:
      maximum-pool-size: 100
    driver-class-name: org.postgresql.Driver
  flyway:
    create-schemas: true
    table: flyway_library_schema_history
    schemas:
      - public
      - library
  jpa:
    properties:
      hibernate:
#        integrator_provider: ru.valkeru.libdemo.config.persistence.ClassImportIntegratorProvider
#        cache:
#          use_second_level_cache: true
#          region:
#            factory_class: org.hibernate.cache.jcache.internal.JCacheRegionFactory
#        javax:
#          cache:
#            provider: org.ehcache.jsr107.EhcacheCachingProvider
    open-in-view: false
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.data.elasticsearch.autoconfigure.DataElasticsearchReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
logging:
  config: classpath:logback-spring.xml
  pattern:
    console: "[%X{requestId:-no-request-id}] %clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} \
               %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} \
               %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}}"
  level:
    tracer: trace
    ru:
      valkeru:
        libdemo: debug
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  open-api:
    info:
      version: 0.0.1-alpha
      title: Вавилонская библиотека
      license:
        name: WTFPL
        url: https://natribu.org
  swagger-ui:
    filter: true
    syntax-highlight:
      theme: idea
    default-model-expand-depth: 50
  enable-hateoas: false
app:
  security:
    jwt:
      secret: uSfKFfguss9AMp7cswFvHEmR4KvqnvfxwE7Fkp4Xj34vof72khNN7cFE7PnWKcLy
      lifetime: 3600
      refresh-lifetime: 604800
  system:
    elasticsearch-enabled: false
management:
  health:
    elasticsearch:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev,pre-production,test
logging:
  level:
    net:
      ttddyy:
        dsproxy:
          listener: trace
    ru:
      valkeru:
        libdemo:
          config:
            persistence:
              ClassImportIntegratorProvider: debug
